*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--text);background:var(--bg);

.hidden{display:none!important}
.spin{width:28px;height:28px;background:var(--accent);animation:sp 1s steps(4) infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.shell{width:100%;max-width:880px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.02),0 24px 48px -28px rgba(60,40,20,.25)}
.art{position:relative;background:var(--accent-soft);padding:36px 32px 28px;display:flex;flex-direction:column;justify-content:space-between;gap:20px}
.art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(210,82,64,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(210,82,64,.07) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.art>*{position:relative}
.tag{align-self:flex-start;font-family:var(--lab);font-weight:700;font-size:13px;color:var(--accent-ink);background:#fff;padding:4px 12px;clip-path:var(--pxc)}
.art img{width:100%;max-width:340px;height:auto;margin:0 auto;display:block}
.slogan{font-weight:700;font-size:20px;line-height:1.35;margin:0}
.slogan span{color:var(--accent-ink)}
.pxdiv{height:6px;width:84px;background-image:repeating-linear-gradient(90deg,var(--accent) 0 6px,transparent 6px 12px);margin-top:10px}
.panel{padding:40px 40px 32px;display:flex;flex-direction:column;justify-content:center}
.logo{align-self:flex-start;margin-bottom:26px}
h1{font-size:27px;line-height:1.3;font-weight:700;margin:0 0 10px}
h1 span{white-space:nowrap}
.sub{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 24px}
label.lab{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.field{position:relative}
.field input{width:100%;font-family:var(--font);font-size:17px;color:var(--text);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:14px 52px 14px 16px;outline:0;transition:border-color .15s,box-shadow .15s}
.field input::placeholder{color:var(--faint)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(210,82,64,.14);background:#fff}
.staticrypt-toggle-password-visibility{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;padding:8px;cursor:pointer;opacity:.45;border-radius:8px}
.staticrypt-toggle-password-visibility:hover{opacity:.8;background:#efece6}
.remember{display:flex;align-items:center;gap:10px;margin:16px 0 22px;font-size:15px;color:var(--muted);cursor:pointer;user-select:none}
.remember input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1.5px solid #c9c3b8;border-radius:5px;background:#fff;display:grid;place-content:center;cursor:pointer;flex:none}
.remember input::after{content:"";width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.remember input:checked{background:var(--accent);border-color:var(--accent)}
.remember input:checked::after{opacity:1}
.keep{font-size:14px;color:var(--faint);margin:12px 0 18px}
.btn{width:100%;font-family:var(--font);font-size:17px;font-weight:700;color:#fff;background:var(--accent);border:0;padding:15px;cursor:pointer;clip-path:var(--pxc);transition:background .15s}
.btn:hover{background:var(--accent-ink)}
.foot{margin-top:24px;font-size:13px;color:var(--faint)}
@media (max-width:760px){
 body{align-items:flex-start;padding:16px}
 .shell{grid-template-columns:minmax(0,1fr);border-radius:16px}
 .art{padding:22px 20px 18px;gap:12px}

 h1{font-size:23px}
